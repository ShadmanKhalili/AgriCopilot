name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Bundle Netlify functions
        # Netlify deploys every top-level file in netlify/functions as a
        # function and bundles each with esbuild. Do the same here so a broken
        # import or syntax error fails the PR, not the deploy.
        run: npx esbuild netlify/functions/*.ts --bundle --platform=node --format=esm --outdir="$RUNNER_TEMP/fn" --log-level=warning
      - name: Build
        run: npm run build
