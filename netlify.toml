[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# --- API rewrites (order matters: specific routes before the /api/* catch-all) ---
#
# Rate limits (Netlify code-based rules — available on every plan, no extra
# account, no dashboard).
#
# Why this exists: the per-account daily allowance inside the AI proxy is a
# floor, not a wall. Firebase email sign-up is open, so anyone can create
# accounts and spread their calls across them. A per-IP limit above the API
# routes is the cheapest hard stop available: one address can no longer drain
# the paid Gemini key or the Sentinel Hub quota in a loop.
#
# `aggregate_by = ["ip", "domain"]` counts every visitor separately, so
# "120" means "120 requests a minute from this one address", not "120 a
# minute for the whole site".
#
# The numbers are deliberately generous. In rural Bangladesh many farmers
# share one public IP (carrier-grade NAT), so a tight limit would throttle
# real users. These caps only bite on traffic no human would generate.
#
# Netlify keeps counting for up to 10 seconds before it starts blocking, so
# a few requests over the line still get through.

# The AI proxy is the only endpoint that spends the paid Gemini key, so it
# gets its own, tighter cap.
[[redirects]]
  from = "/api/ai-proxy"
  to = "/.netlify/functions/ai-proxy"
  status = 200
  [redirects.rate_limit]
    window_limit = 120
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Live video mints a billable Gemini Live session, so it is capped hard.
[[redirects]]
  from = "/api/gemini/live-token"
  to = "/.netlify/functions/gemini-live-token"
  status = 200
  [redirects.rate_limit]
    window_limit = 30
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/weather-next"
  to = "/.netlify/functions/weathernext-3"
  status = 200

# Everything else under /api/ (satellite imagery, soil, weather, location
# lookups). Each call is cheap, but a loop of them is still waste.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  [redirects.rate_limit]
    window_limit = 600
    window_size = 60
    aggregate_by = ["ip", "domain"]

# Build assets are content-hashed and immutable. If one is missing, it means
# the visitor is holding a stale copy of index.html from before a deploy.
# Answering with the SPA fallback (`index.html`, `text/html`) in that case
# makes the browser execute HTML as JavaScript and the app dies on a blank
# white screen. A real 404 is the honest answer.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Production security headers (parity with the Express helmet config) ---

# Content-Security-Policy.
#
# The Express server in `server.ts` has sent a helmet CSP for a long time, but
# that file is NOT the production path: `netlify.toml` rewrites `/api/*` to the
# Netlify functions and the site itself is served by Netlify's CDN, so the
# helmet policy never reached a browser. The deployed site and its function
# responses had **no CSP at all**.
#
# This is the same policy, minus the dev-only localhost extras, plus the
# directives that actually matter for a farm-facing PWA: `object-src 'none'`,
# `base-uri 'self'`, `form-action 'self'`, `script-src-attr 'none'` and a
# `connect-src` that only reaches the APIs the app really uses.
#
# `'unsafe-inline'` and `'unsafe-eval'` are still allowed in `script-src`:
# AdSense's `adsbygoogle.js` injects inline scripts at runtime, and removing
# it would silently kill the ad revenue. Tightening that needs a nonce and is
# tracked separately.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src-attr 'none'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob: data:; frame-ancestors 'self' https://*.google.com https://*.googleusercontent.com https://*.web.app https://*.firebaseapp.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://ep1.adtrafficquality.google https://ep2.adtrafficquality.google https://www.googletagmanager.com https://www.googletagservices.com https://apis.google.com https://adservice.google.com https://partner.googleadservices.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' data: blob: https://*.googleapis.com https://*.firebaseapp.com https://*.firebaseio.com https://*.web.app https://*.firebase.google.com https://*.google.com wss://*.googleapis.com wss://*.google.com wss://*.firebaseio.com https://weather.googleapis.com https://maps.googleapis.com https://api.open-meteo.com https://archive-api.open-meteo.com https://rest.isric.org https://api.worldbank.org https://api.bigdatacloud.net https://get.geojs.io https://identity.dataspace.copernicus.eu https://sh.dataspace.copernicus.eu https://services.sentinel-hub.com https://*.openstreetmap.org https://www.openstreetmap.org https://fonts.googleapis.com https://fonts.gstatic.com https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://*.doubleclick.net; frame-src 'self' https://*.openstreetmap.org https://www.openstreetmap.org https://googleads.g.doubleclick.net https://pagead2.googlesyndication.com https://tpc.googlesyndication.com https://*.googlesyndication.com https://adservice.google.com https://www.google.com https://*.firebaseapp.com"

# The service worker must always be revalidated so PWA updates land immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed build assets are immutable
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
